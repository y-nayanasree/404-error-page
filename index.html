
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="404 page - The page you are looking for could not be found.">
  <title>404 - Page Not Found</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="error-container">
    <div class="illustration" aria-hidden="true">
      <div class="planet">
        <span class="crater crater-one"></span>
        <span class="crater crater-two"></span>
        <span class="crater crater-three"></span>
      </div>
      <div class="orbit orbit-one"></div>
      <div class="orbit orbit-two"></div>
      <span class="star star-one">✦</span>
      <span class="star star-two">✧</span>
      <span class="star star-three">✦</span>
      <span class="floating">?</span>
    </div>

    <p class="error-label">OOPS! SOMETHING WENT WRONG</p>
    <h1>404</h1>
    <h2>Page Not Found</h2>

    <p class="message">
      Looks like this page has gone on a little adventure!
      Don't worry, let's get you back home.
    </p>

    <a class="home-button"
       href="https://y-nayanasree.github.io/simple-resume-website/">
      <span aria-hidden="true">⌂</span> Back to Homepage
    </a>

    <p class="footer-text">Thanks for visiting! Have a lovely day ✨</p>
  </main>
</body>
</html>
